# 통합테스트 전용 프로파일 — 로컬 PostgreSQL의 todolist_db_test 스키마를 직접 사용한다
# (Docker/Testcontainers 금지, PRD 1.3 금지 사항). 커밋 대상이며 시크릿은 담지 않는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=todolist_db_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=todolist_db_test
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

app.password-reset-url=${APP_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.upload-dir=${APP_UPLOAD_DIR:./target/test-uploads}

logging.level.org.hibernate.SQL=debug
