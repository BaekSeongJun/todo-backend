spring.application.name=todo-backend

# --- Database (PostgreSQL / 스키마: todolist_db) ---
# 시크릿은 환경변수로 주입한다 (PRD 9.1). DB_PASSWORD는 기본값을 두지 않는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=todolist_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=todolist_db
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug
