spring.application.name=todo-backend
spring.profiles.active=local

spring.jpa.properties.hibernate.default_schema=todolist_db
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}

app.oauth-redirect-url=${APP_OAUTH_REDIRECT_URL}
app.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.password-reset-url=${APP_PASSWORD_RESET_URL}
app.mail-type=${APP_MAIL_TYPE:log}
app.storage-type=${APP_STORAGE_TYPE:local}
app.download-url-ttl-seconds=${APP_DOWNLOAD_URL_TTL_SECONDS:300}
app.s3-bucket=${APP_S3_BUCKET}
app.s3-region=${APP_S3_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

logging.level.org.hibernate=info
